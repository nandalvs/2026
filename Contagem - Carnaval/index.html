<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - Carnaval</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎭 CARNAVAL 2027 🎭</h1>
        <p>A contagem regressiva para a maior festa do Brasil!</p>
    </header>

    <main>

        <section class="imagem-principal">
            <img src="Carnaval01.jpg" alt="Desfile de Carnaval">
        </section>

        <section class="contagem">
            <h2>🎉 Faltam apenas... 🎉</h2>

            <div id="carnaval">
                00 anos, 00 meses, 00 dias, 00 horas, 00 minutos e 00 segundos
            </div>
        </section>

        <section class="texto">
            <h2>🥳 Prepare a fantasia! 🥳</h2>

            <p>
                A folia está chegando! Prepare sua fantasia,
                reúna os amigos e venha aproveitar o Carnaval!
            </p>
        </section>

        <section class="imagem-secundaria">
            <img src="Carnaval02.jpg" alt="Desfile de Carnaval">
        </section>

    </main>

    <footer>
        <p>🎊 Viva o Carnaval! 🎊</p>
    </footer>

    <script src="carnaval.js"></script>

</body>
</html>
