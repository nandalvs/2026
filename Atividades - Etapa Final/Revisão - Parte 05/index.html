<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão Parte 05</title>

    <style>
        .destaque {
            color: white;
            background-color: lightpink;
            border: 5px solid lightblue;
        }
    </style>
</head>

<body>

    <!-- 1 - Digitação -->

    <input type="text" id="input">
    <p id="mensagem"></p>

    <br><hr><br>


    <!-- 2 - Troca de texto -->

    <button id="botao">Passe o mouse aqui</button>

    <br><hr><br>


    <!-- 3 - Escondendo elementos -->

    <p id="texto">Esse texto vai desaparecer</p>
    <button id="esconder">Dê dois cliques</button>

    <br><hr><br>


    <!-- 4 - Alterando a fonte -->

    <p id="textoFonte">Esse texto vai mudar de tamanho</p>
    <button id="fonte">Alterar tamanho</button>

    <br><hr><br>


    <!-- 5 - Mostrar e esconder -->

    <button id="mostrar">Mostrar</button>
    <button id="esconder2">Esconder</button>

    <p id="paragrafo">Esse parágrafo pode aparecer e desaparecer</p>

    <br><hr><br>


    <!-- 6 - Troca de cor -->

    <div id="caixa" style="width: 200px; height: 100px; background-color: lightblue;"></div>

    <button id="cor">Trocar cor</button>

    <br><hr><br>


    <!-- 7 - Alternando destaque -->

    <p id="classes">Esse texto vai receber destaque</p>

    <button id="troca">Ativar e desativar destaque</button>

    <br><hr><br>


    <!-- 8 - Troca de imagem -->

    <img src="Leon.jpg" alt="Leon" id="img" width="300">

    <br>

    <button id="leon">Leon</button>
    <button id="ada">Ada</button>

    <br><hr><br>


    <!-- 9 - Contador de caracteres -->

    <input type="text" id="caracteres">

    <p id="contador">Quantidade de caracteres: 0</p>

    <br><hr><br>


    <!-- 10 - Verificação de idade -->

    <input type="number" id="idade">

    <button id="verificar">Verificar</button>

    <p id="resultadoIdade"></p>

    <br><hr><br>


    <!-- 11 - Par ou ímpar -->

    <input type="number" id="numero">

    <button id="parImpar">Verificar</button>

    <p id="resultadoNumero"></p>

    <br><hr><br>


    <!-- 12 - Média do aluno -->

    <input type="number" id="nota1" placeholder="Nota 1">
    <input type="number" id="nota2" placeholder="Nota 2">
    <input type="number" id="nota3" placeholder="Nota 3">

    <button id="calcular">Calcular</button>

    <p id="resultadoMedia"></p>


    <script src="Revisão05.js"></script>

</body>
</html>
