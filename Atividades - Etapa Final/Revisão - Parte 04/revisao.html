<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisão - Parte 04</title>
</head>
<body>
    <h1>Revisão - Parte 04</h1>
    <!-- DOM - Manipulação -->

    <!-- 1 - Trocando Textos -->

    <p id="texto">Texto original</p>
    <button onclick="trocarTexto()">Trocar Texto</button>
    <br><br>

    <!-- 2 - Personalizando a div -->

    <div id="divCor">
        Esta é uma div
    </div>
    <br>
    <button onclick="mudarCor()">Mudar cor da div</button>
    <br><br>

    <!-- 3 - Personalização -->

    <p id="textoPersonalizado">Texto para personalizar</p>
    <h2 id="tituloPersonalizado">Título para personalizar</h2>
    <button onclick="personalizar()">Personalizar</button>
    <br><br>

    <!-- 4 - Escondendo o elemento -->

    <div id="elemento">
        Este texto pode desaparecer!
    </div>
    <br>
    <button onclick="esconderMostrar()">Esconder / Mostrar</button>
    <script src="Revisao.js"></script>

</body>
</html>
